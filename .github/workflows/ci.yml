name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.23 is the floor declared in go.mod - if it breaks there, the module
        # directive is lying. stable catches anything the newest toolchain tightens.
        go: ["1.23", "stable"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # -race matters here: the confirmation prompt hands a request from the
      # agent's goroutine to the Bubble Tea update loop and blocks on the reply.
      - name: test
        run: go test -race -count=1 ./...

      - name: tidy is committed
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  # shell_other.go is never compiled by the test job: the !unix build tag means
  # the Linux build picks shell_unix.go and the other file could stop compiling
  # without anything here noticing, until a Windows user hit it. Cross-compiling
  # is as far as this can go without runners for those platforms - it proves the
  # files build and vet, not that killing a process group works there.
  cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

      - name: vet ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go vet ./...
